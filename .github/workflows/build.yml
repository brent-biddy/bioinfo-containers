name: Build check

# Builds without pushing, so a broken definition is caught before anyone tags a release.
#
# python_cpu and python_gpu are handled identically — same steps, same checks, no
# GPU-specific tooling. Whether a RAPIDS build fits a hosted runner is not worked around in
# advance; it either passes here or the failure tells us what it needs.
#
# cellpose_gpu is absent because it is FROM python_gpu, so it cannot build until a python_gpu
# tag is published. It joins this matrix once one exists.

on:
  pull_request:
    paths:
      - 'definitions/**'
      - '.github/workflows/build.yml'
  push:
    branches: [main]
    paths:
      - 'definitions/**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Both run even if one fails: if the GPU build dies on disk we still want to know the
      # CPU one is fine, and vice versa.
      fail-fast: false
      matrix:
        image: [python_cpu, python_gpu]

    steps:
      - uses: actions/checkout@v4

      - name: Disk before
        run: df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: definitions
          file: definitions/${{ matrix.image }}/Dockerfile
          push: false
          load: true
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Disk after
        if: always()
        run: df -h /

      # The Dockerfile already imports the stack at build time. This checks what an import
      # cannot: that the image presents its own environment rather than expecting the caller
      # to set one up.
      - name: Check ${{ matrix.image }} configures itself
        run: |
          docker run --rm ${{ matrix.image }}:ci bash -c '
            set -e
            [ -n "$JUPYTER_PATH" ] || { echo "JUPYTER_PATH unset"; exit 1; }
            [ -n "$CONDA_PREFIX" ] || { echo "CONDA_PREFIX unset"; exit 1; }
            case "$(which python)" in
              /opt/conda/envs/${{ matrix.image }}/bin/python) ;;
              *) echo "python is $(which python), not the env"; exit 1 ;;
            esac
            # Only the image own kernelspecs should be discoverable, so a notebook that pins
            # no kernel resolves here rather than to whatever the host happens to have.
            jupyter kernelspec list 2>/dev/null | grep -q "/opt/conda/envs/${{ matrix.image }}" \
              || { echo "image kernelspec not found"; exit 1; }
            echo "configures itself: ok"
          '
