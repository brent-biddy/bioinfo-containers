name: Build check

# Builds without publishing, so a broken definition is caught before anyone tags a release.
# Each definition's %test runs against the finished SIF, which is where the image's guarantees
# are asserted -- that it configures itself rather than expecting a caller to.
#
# python_cpu only. The GPU images are on the `gpu-images` branch: they raise larger questions
# -- whether a RAPIDS build fits a hosted runner, and whether RAPIDS can satisfy the pinned
# versions at all -- and there is no reason to answer those before something works end to end.

on:
  pull_request:
    paths:
      - 'definitions/**'
      - '.github/workflows/build.yml'
  push:
    branches: [main]
    paths:
      - 'definitions/**'

env:
  APPTAINER_VERSION: 1.3.6

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Kept even with one entry: adding an image is then a one-word change, and a failure in
      # one never hides a pass in another.
      fail-fast: false
      matrix:
        image: [python_cpu]

    steps:
      - uses: actions/checkout@v4

      - name: Disk before
        run: df -h /

      - name: Install Apptainer
        run: |
          curl -fsSLo apptainer.deb \
            "https://github.com/apptainer/apptainer/releases/download/v${APPTAINER_VERSION}/apptainer_${APPTAINER_VERSION}_amd64.deb"
          sudo apt-get update
          sudo apt-get install -y ./apptainer.deb
          rm -f apptainer.deb
          apptainer --version

      # Context is definitions/, not the image's own directory, because every image needs
      # python_cpu/environment.yml as well as its own overlay.
      #
      # Built with --notest: %test asserts the image's %environment, which is not yet in
      # effect during a build-time test run. It is run against the finished SIF in the next
      # step instead -- which is the artifact that gets published, so that is the meaningful
      # place to check it.
      - name: Build ${{ matrix.image }}
        run: |
          sudo apptainer build --notest "${{ matrix.image }}.sif" \
            "definitions/${{ matrix.image }}/Apptainer.def"
          ls -lh "${{ matrix.image }}.sif"

      # This is where %test actually runs: against the finished SIF, with the image's
      # %environment in effect. It asserts the guarantees an import check cannot -- that the
      # image configures itself rather than expecting the caller to.
      - name: Test ${{ matrix.image }}
        run: apptainer test "${{ matrix.image }}.sif"

      - name: Disk after
        if: always()
        run: df -h /
