name: Release

# Trigger: push a tag in the form  container-name/vX.Y.Z
# Example: git tag scrnaseq/v1.0.0 && git push origin scrnaseq/v1.0.0

on:
  push:
    tags:
      - '*/v[0-9]*'

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Parse tag
        id: parse
        run: |
          TAG="${{ github.ref_name }}"        # e.g. scrnaseq/v1.2.0
          CONTAINER="${TAG%/v*}"              # scrnaseq
          VERSION="${TAG#*/v}"               # 1.2.0
          echo "container=$CONTAINER"  >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"      >> "$GITHUB_OUTPUT"
          echo "image=${{ vars.DOCKERHUB_ORG }}/$CONTAINER" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build ${{ steps.parse.outputs.container }}:${{ steps.parse.outputs.version }}
        uses: docker/build-push-action@v6
        with:
          context: containers/${{ steps.parse.outputs.container }}
          load: true
          tags: ${{ steps.parse.outputs.container }}:local
          cache-from: type=gha,scope=${{ steps.parse.outputs.container }}
          cache-to: type=gha,mode=max,scope=${{ steps.parse.outputs.container }}

      - name: Test ${{ steps.parse.outputs.container }}
        run: ./scripts/test.sh ${{ steps.parse.outputs.container }}

      - name: Push ${{ steps.parse.outputs.container }}:${{ steps.parse.outputs.version }}
        uses: docker/build-push-action@v6
        with:
          context: containers/${{ steps.parse.outputs.container }}
          push: true
          tags: |
            ${{ steps.parse.outputs.image }}:${{ steps.parse.outputs.version }}
            ${{ steps.parse.outputs.image }}:latest
          cache-from: type=gha,scope=${{ steps.parse.outputs.container }}
          labels: |
            org.opencontainers.image.version=${{ steps.parse.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
