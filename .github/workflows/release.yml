name: Release

# Trigger: push a tag of the form  <container>/vX.Y.Z
#
#   git tag python_cpu/v1.0.0 && git push origin python_cpu/v1.0.0
#
# The tag names which definition to build, so one workflow serves every image and adding a new
# one needs no change here.
#
# The SIF is the product, and the only one. Everything runs under Apptainer -- on OSCER and
# under WSL -- and converting an OCI image to a SIF is the expensive step, not the pull: it
# exceeds Nextflow's 20 minute default and is paid inside a job's wall clock, which is why
# merfish_testis carries pullTimeout = '2h'. Publishing a ready-made SIF removes that entirely.
#
# There is no Docker anywhere in this repo. The definitions bootstrap from docker:// base
# images, but nothing produces an OCI artifact, so there is no daemon, no second definition
# format to keep in step, and no registry credential beyond the built-in GITHUB_TOKEN.
#
# Pull one with:
#
#   apptainer pull oras://ghcr.io/brent-biddy/python_cpu-sif:1.0.0
#
# Nextflow takes the same URI as process.container and downloads it into cacheDir without
# converting anything -- this is what Wave does for its own Singularity images. Keep
# apptainer.ociAutoPull and ociMode off (they are off by default): both make the runtime treat
# the image as OCI and convert it, which is precisely what publishing a SIF avoids.

on:
  push:
    tags:
      - '*/v[0-9]*'

env:
  APPTAINER_VERSION: 1.3.6

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Parse tag
        id: parse
        run: |
          TAG="${{ github.ref_name }}"        # python_cpu/v1.0.0
          CONTAINER="${TAG%/v*}"              # python_cpu
          VERSION="${TAG#*/v}"                # 1.0.0
          if [ ! -f "definitions/${CONTAINER}/Apptainer.def" ]; then
            echo "::error::No definitions/${CONTAINER}/Apptainer.def — tag names an image that does not exist"
            exit 1
          fi
          echo "container=$CONTAINER" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"     >> "$GITHUB_OUTPUT"

      - name: Disk before
        run: df -h /

      - name: Install Apptainer
        run: |
          curl -fsSLo apptainer.deb \
            "https://github.com/apptainer/apptainer/releases/download/v${APPTAINER_VERSION}/apptainer_${APPTAINER_VERSION}_amd64.deb"
          sudo apt-get update
          sudo apt-get install -y ./apptainer.deb
          rm -f apptainer.deb
          apptainer --version

      # Context is definitions/, because every image needs python_cpu/environment.yml as well
      # as its own overlay.
      #
      # Built with --notest: %test asserts the image's %environment, which is not yet in
      # effect during a build-time test run. It is run against the finished SIF in the next
      # step instead -- which is the artifact that gets published, so that is the meaningful
      # place to check it.
      - name: Build SIF
        run: |
          sudo apptainer build --notest "${{ steps.parse.outputs.container }}.sif" \
            "definitions/${{ steps.parse.outputs.container }}/Apptainer.def"
          ls -lh "${{ steps.parse.outputs.container }}.sif"

      - name: Test the built SIF
        run: apptainer test "${{ steps.parse.outputs.container }}.sif"

      - name: Push SIF to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            apptainer registry login --username "${{ github.actor }}" --password-stdin oras://ghcr.io
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          NAME="${{ steps.parse.outputs.container }}"
          VER="${{ steps.parse.outputs.version }}"
          apptainer push "${NAME}.sif" "oras://ghcr.io/${OWNER}/${NAME}-sif:${VER}"
          apptainer push "${NAME}.sif" "oras://ghcr.io/${OWNER}/${NAME}-sif:latest"

      - name: Disk after
        if: always()
        run: df -h /

      - name: Summary
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          NAME="${{ steps.parse.outputs.container }}"
          VER="${{ steps.parse.outputs.version }}"
          {
            echo "### ${NAME} ${VER}"
            echo ""
            echo '```bash'
            echo "apptainer pull oras://ghcr.io/${OWNER}/${NAME}-sif:${VER}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
