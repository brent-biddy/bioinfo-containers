name: CI

on:
  pull_request:
    paths:
      - 'containers/**'

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changed.outputs.matrix }}
      any: ${{ steps.changed.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed containers
        id: changed
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep '^containers/' \
            | cut -d/ -f2 \
            | sort -u \
            | jq -R . | jq -sc .)
          echo "matrix=$changed" >> "$GITHUB_OUTPUT"
          echo "any=$([ "$changed" = '[]' ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.container }}
        uses: docker/build-push-action@v6
        with:
          context: containers/${{ matrix.container }}
          push: false
          cache-from: type=gha,scope=${{ matrix.container }}
          cache-to: type=gha,mode=max,scope=${{ matrix.container }}
