# The GPU overlay. Installed on top of definitions/python_cpu/environment.yml, which carries
# the analysis stack -- so a package cannot be at a different version in the step that clusters
# on a card and the step that annotates on a CPU. Only CUDA-specific packages belong here.
#
# torch and cellpose are deliberately absent: cellpose is torch's only consumer anywhere in the
# repos, so they live in cellpose_gpu, which is built on this image. The clustering image does
# not carry a deep learning stack it never calls.
#
# This replaces python_spatial, which is frozen and will be retired once the repos move over.
name: python_gpu

channels:
  - rapidsai
  - nvidia
  - conda-forge

dependencies:
  - cuda-version=12.9
  - cuml=26.04
  - cuvs=26.04
  - cugraph=26.04
  - pip:
    - rapids-singlecell-cu12==0.15.2
