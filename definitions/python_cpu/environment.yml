# The CPU image's environment, and the shared base every other image is built from.
#
# Versions are pinned to what a verified build resolved. Pinning is not only about
# reproducibility here: a shared spec does not mean a shared solve. python_gpu adds RAPIDS,
# which pins dask, which caps spatialdata -- so unpinned, the two images would quietly carry
# different spatialdata versions while appearing to share this file. The GPU step would write a
# zarr with one version and the CPU annotate step read it with another.
#
# Pinned, that divergence becomes a build failure instead of a silent mismatch. If python_gpu
# cannot solve these versions, its build fails and says so, which is the signal that RAPIDS and
# this stack have parted ways -- decide then, rather than finding out from a corrupt object.
#
# These are direct dependencies only; transitive ones still float. A lock file would fix that
# and skip the solve entirely, and is worth adding once CI is known good.
#
# python_gpu adds definitions/python_gpu/environment.yml on top of this, and cellpose_gpu is
# built on python_gpu. So a package cannot be at a different version in the step that clusters
# on a card and the step that annotates on a CPU. Nothing in this file may require CUDA.
#
# python_spatial is not built from this file. It is frozen at 1.2.0 and will be retired once
# the repos move to python_gpu; leaving it alone is why the analysis stack is briefly written
# in two places.
name: python_cpu

channels:
  - conda-forge

dependencies:
  - python=3.12
  - pip

  # Notebook execution. Quarto itself is installed from a .deb in the Dockerfile, but it
  # runs notebooks through this machinery.
  - ipykernel=7.3.0
  - nbclient=0.11.0
  - nbformat=5.11.1
  - papermill=2.7.0
  - pyyaml=6.0.3

  # Core numerics
  - numpy=2.5.2
  - pandas=3.0.5
  - scipy=1.18.0
  - scikit-learn=1.6.1
  - matplotlib=3.11.1

  # Single cell and spatial
  - anndata=0.13.3.post0
  - scanpy=1.12.4
  - squidpy=1.8.2
  - spatialdata=0.8.0
  - spatialdata-io=0.7.0
  - spatialdata-plot=0.4.2
  - python-igraph=1.0.0
  - leidenalg=0.12.0
  - session-info=1.0.0

  # Geometry, imaging: segmentation boundaries and label rasters
  - geopandas=1.1.4
  - shapely=2.1.2
  - scikit-image=0.26.0
  - h5py=3.16.0
  - tifffile=2026.3.3

  - pip:
    - scikit-learn==1.6.1
    - seaborn==0.13.2
    - plotly==7.0.0
    - gseapy==1.3.1
    - opencv-python-headless==5.0.0.93
    - matplotlib-scalebar==0.9.0
    - matplotlib-venn==1.1.2
    - session-info2==0.4.2
    - dask-image==2026.5.0
    - omnipath==1.0.12
