# The CPU image: everything the pipelines do that is not GPU work.
#
# Versions are taken from python_spatial 1.2.0 -- the image every repo currently runs -- because
# that is the set known to work against the pipeline code, not merely to install.
#
# That distinction cost a build. An earlier version of this file pinned whatever the solver
# picked fresh: anndata 0.13, pandas 3.0, spatialdata 0.8. It built, imported everything, and
# passed its tests -- then died reading a MERSCOPE directory, because anndata 0.13 dropped the
# `dtype` argument that spatialdata-io still passes. Nothing short of running real code would
# have caught it.
#
# So: change these deliberately, and prove the change against an actual pipeline step before
# publishing. Newer is not the goal; working is.
name: python_cpu

channels:
  - conda-forge

dependencies:
  - python=3.12.13
  - pip

  # Notebook execution. Quarto is installed from a .deb in the definition, but it runs
  # notebooks through this machinery.
  - ipykernel=7.3.0
  - nbclient=0.11.0
  - nbformat=5.10.4
  - papermill=2.7.0
  - pyyaml=6.0.3

  # Core numerics
  - numpy=2.4.6
  - pandas=2.3.3
  - scipy=1.16.3
  - scikit-learn=1.6.1
  - matplotlib=3.11.0

  # Single cell and spatial
  - anndata=0.12.19
  - scanpy=1.12.1
  - squidpy=1.8.2
  - spatialdata=0.7.3
  - spatialdata-io=0.7.0
  - spatialdata-plot=0.4.0
  - python-igraph=1.0.0
  - leidenalg=0.12.0
  - session-info=1.0.0

  # Geometry and imaging: segmentation boundaries and label rasters
  - geopandas=1.1.4
  - shapely=2.1.2
  - scikit-image=0.26.0
  - h5py=3.16.0
  - tifffile=2026.3.3

  - pip:
    - seaborn==0.13.2
    - plotly==6.8.0
    - gseapy==1.3.0
    - opencv-python-headless==5.0.0.93
    - matplotlib-scalebar==0.9.0
    - matplotlib-venn==1.1.2
    - session-info2==0.4.1
    - dask-image==2026.5.0
    - omnipath==1.0.12
